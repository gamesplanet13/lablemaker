<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi Label Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 100px 20px 60px;
    }
    .label-block {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .label-wrapper {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    textarea.label-input {
      width: 100%;
      height: 220px;
      font-family: monospace;
      padding: 10px;
    }
    .label-actions {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }
    .label-actions button {
      font-size: 12px;
      padding: 4px 6px;
    }
    .floating-buttons {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .floating-buttons button {
      padding: 6px 12px;
      font-size: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .label-count {
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="floating-buttons">
  <div>
    <button onclick="generatePDF('save')">📄 PDF</button>
    <button onclick="generatePDF('print')">🖨️ Print</button>
    <button onclick="addNewTextarea()">➕ Add</button>
  </div>
  <div class="label-count" id="labelCount">Total Labels: 0</div>
</div>

<div class="label-block" id="labelContainer"></div>

<script>
window.onload = () => {
  window.jsPDF = window.jspdf.jsPDF;
  for (let i = 0; i < 8; i++) addNewTextarea();
};

function addNewTextarea() {
  const container = document.getElementById("labelContainer");
  const wrapper = document.createElement("div");
  wrapper.className = "label-wrapper";
  wrapper.innerHTML = `
    <textarea class="label-input" oninput="updateLabelCount()"></textarea>
    <div class="label-actions">
      <button onclick="clearLabel(this)">❌ Clear</button>
      <button onclick="deleteLabel(this)">🗑️ Delete</button>
    </div>
  `;
  container.appendChild(wrapper);
  updateLabelCount();
}

function clearLabel(btn) {
  btn.closest(".label-wrapper").querySelector(".label-input").value = "";
  updateLabelCount();
}

function deleteLabel(btn) {
  btn.closest(".label-wrapper").remove();
  updateLabelCount();
}

function updateLabelCount() {
  const total = document.querySelectorAll(".label-input").length;
  const filled = Array.from(document.querySelectorAll(".label-input")).filter(input => input.value.trim() !== "").length;
  document.getElementById("labelCount").innerText = `Total Labels: ${total} | Filled: ${filled}`;
}

function capitalizeWords(str) {
  return str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
}

function cleanJoin(parts, separator = ", ") {
  return parts.map(value => (value || "").trim()).filter(Boolean).join(separator);
}

function drawFittedText(doc, text, x, y, maxWidth, maxHeight, options = {}) {
  const {
    startSize = 9,
    minSize = 6.2,
    lineHeightFactor = 1.08,
    align = "left",
    fontStyle = "normal",
    color = [0, 0, 0]
  } = options;

  doc.setFont("helvetica", fontStyle);
  doc.setTextColor(...color);
  let size = startSize;
  let lines = [];
  let lineHeight = 0;

  while (size >= minSize) {
    doc.setFontSize(size);
    lines = doc.splitTextToSize(String(text || ""), maxWidth);
    lineHeight = size * 0.3528 * lineHeightFactor;
    if (lines.length * lineHeight <= maxHeight) break;
    size -= 0.35;
  }

  doc.setFontSize(Math.max(size, minSize));
  const maxLines = Math.max(1, Math.floor(maxHeight / Math.max(lineHeight, 1)));
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    let last = lines[maxLines - 1];
    while (last.length && doc.getTextWidth(last + "…") > maxWidth) last = last.slice(0, -1);
    lines[maxLines - 1] = last.trimEnd() + "…";
  }

  doc.text(lines, x, y, { align, lineHeightFactor });
  return { lines, size, height: lines.length * lineHeight };
}

function generatePDF(mode = 'save') {
  const inputs = Array.from(document.querySelectorAll(".label-input"));
  const filledInputs = inputs.map(i => i.value.trim()).filter(Boolean);
  if (!filledInputs.length) return alert("Please fill at least one label");

  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const cols = 2, rows = 4;
  const labelWidth = 210 / cols;
  const labelHeight = 297 / rows;
  const today = new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });

  filledInputs.forEach((input, idx) => {
    if (idx > 0 && idx % (cols * rows) === 0) doc.addPage();
    const col = idx % cols;
    const row = Math.floor((idx % (cols * rows)) / cols);
    const x = col * labelWidth;
    const y = row * labelHeight;

    const lines = input.split(/\n|\r/);
    const data = {};
    let currentKey = "";
    lines.forEach((line, i) => {
      const parts = line.split(":");
      if (parts.length > 1) {
        currentKey = parts[0].trim().toLowerCase();
        let value = parts.slice(1).join(":").trim();
        data[currentKey] = value;
      } else if (currentKey && line.trim() !== "") {
        data[currentKey] = (data[currentKey] + " " + line.trim())
          .replace(/\s+/g, " ")
          .trim();
      }
    });

    if (data["Alt. Mobile"]) data["Alt Mobile"] = data["Alt. Mobile"];
    if (data["City"]) data["District/City"] = data["City"];
    if (data["Product name"]) data["Product"] = data["Product name"];
    if (data["GB"]) data["Variant"] = (data["Variant"] || "") + ` ${data["GB"]}GB`;
    if (data["Amount to be paid"]) data["Amount paid"] = data["Amount to be paid"];
    
// Convert all keys to lowercase for consistent access
const normalizedData = {};
Object.keys(data).forEach(k => {
  normalizedData[k.trim().toLowerCase()] = data[k];
});

function getField(possibleKeys) {
  for (let key of possibleKeys) {
    const lowerKey = key.toLowerCase();
    if (normalizedData[lowerKey]) return normalizedData[lowerKey];
  }
  return "";
}

// Standardized field assignments (case-insensitive)
data["Alt Mobile"]   = getField(["Alt. Mobile", "Alt mobile", "Alt, mobile", "AltMobile"]);
data["Mobile"]       = getField(["Mobile", "Mob"]);
data["Email"]        = getField(["Email", "Mail"]);
data["District/City"]= getField(["City", "City/District", "District/City"]);
data["Pincode"]      = getField(["Pincode", "Pin", "PIN", "Pincod", "Postal Code", "Pin Code"]);
data["Address"]      = getField(["Address", "Complete Address"]);
data["Product"]      = getField(["Product Name", "Product"]);
data["Variant"]      = getField(["Variant", "GB (if available)"]);
data["Amount paid"]  = getField(["Amount Paid", "Paid Amount", "Amount"]);
data["Base Price"]   = getField(["Base Price", "Price"]);
data["Discount Applied"] = getField(["Discount", "Discount Applied"]);
data["Order ID"]     = getField(["Order ID", "OrderId", "Order Id"]);
data["Name"]         = getField(["Name", "Customer Name", "Customer"]);

data["Landmark"]     = getField(["Landmark", "Land mark", "Nearby", "Near"]);
data["Post office"]  = getField(["Post Office", "Post office", "PO"]);
data["State"]        = getField(["State"]);


// Append GB to Variant if available
if (normalizedData["gb"]) {
  data["Variant"] = (data["Variant"] || "") + ` ${normalizedData["gb"]}GB`;
}

// Fallback to first line as Name if Name is still missing
if (!data["Name"] && lines.length > 0) {
  data["Name"] = lines[0].trim();
}


// Apply default values if missing
if (!data["Product"]) data["Product"] = "Game Product";
if (!data["Amount paid"]) data["Amount paid"] = "Rs.9999";

// Required fields check
const requiredFields = ["Name", "Mobile", "Pincode", "Address"];
const missingFields = requiredFields.filter(field => !data[field] || data[field].trim() === "");
if (missingFields.length > 0) {
  const alertDiv = document.createElement("div");
  alertDiv.textContent = "Missing fields: " + missingFields.join(", ");
  alertDiv.style.position = "fixed";
  alertDiv.style.top = "20px";
  alertDiv.style.left = "50%";
  alertDiv.style.transform = "translateX(-50%)";
  alertDiv.style.background = "#ff4d4d";
  alertDiv.style.color = "white";
  alertDiv.style.padding = "10px 20px";
  alertDiv.style.borderRadius = "5px";
  alertDiv.style.fontSize = "16px";
  alertDiv.style.zIndex = "9999";
  document.body.appendChild(alertDiv);
  setTimeout(() => alertDiv.remove(), 5000);
  return; // stop PDF generation
}


if (!data["Order ID"]) {
      const now = new Date();
      const pad = n => n.toString().padStart(2, '0');
      data["Order ID"] = `ORD${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
    }

    const nameLine = `${data["Name"] || ""}`;
    const mobileLine = `${data["Mobile"] || ""}${data["Alt Mobile"] ? " / " + data["Alt Mobile"] : ""}`;
    const addressLine = cleanJoin([
      data["Address"],
      data["Landmark"] ? `Near ${data["Landmark"]}` : "",
      data["Post office"] ? `PO ${data["Post office"]}` : "",
      data["District/City"],
      data["Pincode"],
      data["State"]
    ]);

    doc.setFont("helvetica");
    const left = x + 3.5;
    const right = x + labelWidth - 3.5;
    const innerWidth = labelWidth - 7;
    const top = y + 3.5;
    const bottom = y + labelHeight - 3.5;

    doc.setFillColor(255, 255, 255);
    doc.setDrawColor(38, 50, 56);
    doc.setLineWidth(0.45);
    doc.roundedRect(x + 2, y + 2, labelWidth - 4, labelHeight - 4, 2, 2, "FD");
    doc.setDrawColor(176, 190, 197);
    doc.setLineWidth(0.18);
    doc.roundedRect(x + 2.7, y + 2.7, labelWidth - 5.4, labelHeight - 5.4, 1.4, 1.4);

    doc.setFillColor(246, 250, 253);
    doc.setDrawColor(207, 216, 220);
    doc.roundedRect(left, top, innerWidth, 11.4, 1, 1, "FD");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(6.4);
    doc.setTextColor(69, 90, 100);
    doc.text("DELIVER", left + 1.5, top + 3.2);
    doc.setFontSize(11.5);
    doc.setTextColor(14, 55, 92);
    doc.text("TO", left + 1.5, top + 8.4);

    // Three clearly separated dark colours: name, mobile and address.
    drawFittedText(doc, nameLine.toUpperCase(), right - 1.2, top + 8.1, innerWidth - 17, 8.3, {
      startSize: 20.5, minSize: 12.0, align: "right", fontStyle: "bold", color: [14, 55, 92]
    });

    doc.setFillColor(251, 247, 252);
    doc.setDrawColor(232, 219, 235);
    doc.roundedRect(left, top + 12.3, innerWidth, 8.6, 0.9, 0.9, "FD");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(6.4);
    doc.setTextColor(91, 33, 105);
    doc.text("CONTACT", left + 1.5, top + 17.4);
    drawFittedText(doc, mobileLine, right - 1.2, top + 18.3, innerWidth - 13, 6.5, {
      startSize: 17.2, minSize: 10.0, align: "right", fontStyle: "bold", color: [91, 33, 105]
    });

    doc.setFillColor(249, 252, 251);
    doc.setDrawColor(224, 237, 234);
    doc.roundedRect(left, top + 22.0, innerWidth, 23.1, 0.9, 0.9, "FD");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(6.8);
    doc.setTextColor(76, 110, 104);
    doc.text("ADDRESS", left + 1.5, top + 25.0);
    drawFittedText(doc, addressLine, right - 1.2, top + 29.2, innerWidth - 3, 15.0, {
      startSize: 14.5, minSize: 8.0, align: "right", fontStyle: "bold", color: [38, 73, 67]
    });

    // Strict fixed rows: no detail can cross the order-panel boundary.
    const orderTop = top + 46.2;
    const orderBottom = bottom - 11.7;
    doc.setFillColor(252, 252, 252);
    doc.setDrawColor(210, 214, 216);
    doc.roundedRect(left, orderTop, innerWidth, orderBottom - orderTop, 1.2, 1.2, "FD");
    doc.setFillColor(247, 249, 250);
    doc.roundedRect(left, orderTop, innerWidth, 2.2, 0.8, 0.8, "F");
    doc.rect(left, orderTop + 1.1, innerWidth, 1.1, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(4.8);
    doc.setTextColor(55, 71, 79);
    doc.text("ORDER DETAILS", left + 1.2, orderTop + 1.55);

    const metaText = `DATE: ${today}   |   ORDER ID: ${data["Order ID"] || ""}`;
    const productText = cleanJoin([
      `PRODUCT: ${data["Product"] || ""}`,
      data["Variant"] ? `VARIANT: ${data["Variant"]}` : ""
    ], "   |   ");
    const priceText = cleanJoin([
      `AMOUNT PAID: ${data["Amount paid"] || ""}`,
      data["Base Price"] ? `BASE PRICE: ${data["Base Price"]}` : "",
      data["Discount Applied"] ? `DISCOUNT: ${data["Discount Applied"]}` : ""
    ], "   |   ");

    const metaTop = orderTop + 2.3;
    const productTop = orderTop + 4.5;
    const priceTop = orderTop + 7.0;
    doc.setDrawColor(230, 232, 234);
    doc.line(left + 1.2, productTop - 0.7, right - 1.2, productTop - 0.7);
    doc.line(left + 1.2, priceTop - 0.7, right - 1.2, priceTop - 0.7);

    drawFittedText(doc, metaText, left + 1.2, metaTop + 1.35, innerWidth - 2.4, 1.9, {
      startSize: 5.2, minSize: 4.2, fontStyle: "bold", color: [55, 71, 79]
    });
    drawFittedText(doc, productText, left + 1.2, productTop + 1.3, innerWidth - 2.4, 2.15, {
      startSize: 5.0, minSize: 4.0, fontStyle: "bold", color: [96, 52, 52]
    });
    drawFittedText(doc, priceText, left + 1.2, priceTop + 1.25, innerWidth - 2.4, Math.max(1.5, orderBottom - priceTop - 0.35), {
      startSize: 4.9, minSize: 3.9, fontStyle: "bold", color: [96, 52, 52]
    });

    // Sender area remains fixed at the bottom and cannot be displaced by order data.
    doc.setFillColor(247, 250, 252);
    doc.setDrawColor(218, 228, 235);
    doc.roundedRect(left, bottom - 10.2, innerWidth, 10.2, 1.0, 1.0, "FD");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(7.3);
    doc.setTextColor(55, 75, 92);
    doc.text("FROM: GAMES PLANET   MOB: 7983624797", right - 0.6, bottom - 7.35, { align: "right" });
    doc.setFontSize(6.9);
    doc.setTextColor(76, 100, 96);
    doc.text("GURUDWARA ROAD NEAR JK'S TYRE", right - 0.6, bottom - 4.65, { align: "right" });
    doc.text("CIVIL LINES RAMPUR U.P. 244901", right - 0.6, bottom - 2.0, { align: "right" });
    doc.setFont(undefined, "normal");
    doc.setTextColor(0, 0, 0);
  });

  if (mode === 'print') {
    const blobURL = doc.output('bloburl');
    const win = window.open(blobURL, '_blank');
    if (win) {
      win.onload = () => {
        win.focus();
        win.print();
      };
    }
  } else {
    doc.save("labels.pdf");
  }
}
</script>
</body>
</html>
