<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Games Planet Label Maker — Premium Recreated</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 100px 20px 60px;
    }
    .label-block {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .label-wrapper {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    textarea.label-input {
      width: 100%;
      height: 220px;
      font-family: monospace;
      padding: 10px;
    }
    .label-actions {
      display: flex;
      gap: 6px;
      justify-content: space-between;
    }
    .label-actions button {
      font-size: 12px;
      padding: 4px 6px;
    }
    .floating-buttons {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .floating-buttons button {
      padding: 6px 12px;
      font-size: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .label-count {
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="floating-buttons">
  <div>
    <button onclick="generatePDF('save')">📄 PDF</button>
    <button onclick="generatePDF('print')">🖨️ Print</button>
    <button onclick="addNewTextarea()">➕ Add</button>
  </div>
  <div class="label-count" id="labelCount">Total Labels: 0</div>
</div>

<div class="label-block" id="labelContainer"></div>

<script>
window.onload = () => {
  window.jsPDF = window.jspdf.jsPDF;
  for (let i = 0; i < 8; i++) addNewTextarea();
};

function addNewTextarea() {
  const container = document.getElementById("labelContainer");
  const wrapper = document.createElement("div");
  wrapper.className = "label-wrapper";
  wrapper.innerHTML = `
    <textarea class="label-input" oninput="updateLabelCount()"></textarea>
    <div class="label-actions">
      <button onclick="clearLabel(this)">❌ Clear</button>
      <button onclick="deleteLabel(this)">🗑️ Delete</button>
    </div>
  `;
  container.appendChild(wrapper);
  updateLabelCount();
}

function clearLabel(btn) {
  btn.closest(".label-wrapper").querySelector(".label-input").value = "";
  updateLabelCount();
}

function deleteLabel(btn) {
  btn.closest(".label-wrapper").remove();
  updateLabelCount();
}

function updateLabelCount() {
  const total = document.querySelectorAll(".label-input").length;
  const filled = Array.from(document.querySelectorAll(".label-input")).filter(input => input.value.trim() !== "").length;
  document.getElementById("labelCount").innerText = `Total Labels: ${total} | Filled: ${filled}`;
}

function capitalizeWords(str) {
  return str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
}

function cleanJoin(parts, separator = ", ") {
  return parts.map(value => (value || "").trim()).filter(Boolean).join(separator);
}

function hslToRgb(h, s, l) {
  s /= 100;
  l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const hp = ((h % 360) + 360) % 360 / 60;
  const x = c * (1 - Math.abs((hp % 2) - 1));
  let rgb = [0, 0, 0];
  if (hp < 1) rgb = [c, x, 0];
  else if (hp < 2) rgb = [x, c, 0];
  else if (hp < 3) rgb = [0, c, x];
  else if (hp < 4) rgb = [0, x, c];
  else if (hp < 5) rgb = [x, 0, c];
  else rgb = [c, 0, x];
  const m = l - c / 2;
  return rgb.map(channel => Math.round((channel + m) * 255));
}

function createRandomPremiumThemes(count) {
  const startHue = Math.random() * 360;
  return Array.from({ length: count }, (_, index) => {
    // Golden-angle spacing keeps neighbouring labels visibly different.
    const hue = (startHue + index * 137.508 + Math.random() * 22) % 360;
    return {
      base: hslToRgb(hue, 38 + Math.random() * 14, 97.2),
      edge: hslToRgb(hue, 38 + Math.random() * 14, 72 + Math.random() * 5),
      name: hslToRgb(hue, 46, 29),
      contact: hslToRgb((hue + 42) % 360, 40, 34),
      address: hslToRgb((hue + 325) % 360, 38, 31)
    };
  });
}

function normalizeComparable(value) {
  return String(value || "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function appendUniquePart(base, value, prefix = "") {
  const cleanValue = String(value || "").trim();
  if (!cleanValue) return base;
  const normalizedBase = normalizeComparable(base);
  const normalizedValue = normalizeComparable(cleanValue);
  if (normalizedValue && normalizedBase.includes(normalizedValue)) return base;
  return cleanJoin([base, `${prefix}${cleanValue}`]);
}

function removeRepeatedParts(text, values) {
  let result = String(text || "");
  values.filter(Boolean).forEach(value => {
    const escaped = String(value).trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (escaped) result = result.replace(new RegExp(escaped, "gi"), " ");
  });
  result = result
    .replace(/\(\s*\)/g, " ")
    .replace(/\s*[,/-]\s*[,/-]+/g, ", ")
    .replace(/^[\s,/-]+|[\s,/-]+$/g, "")
    .replace(/\b([a-z0-9]+)(?:\s+\1\b)+/gi, "$1")
    .replace(/\s+/g, " ")
    .trim();
  const seen = new Set();
  return result.split(/\s*,\s*/).filter(part => {
    const normalized = normalizeComparable(part);
    if (!normalized || seen.has(normalized)) return false;
    seen.add(normalized);
    return true;
  }).join(", ");
}

function removeAllDuplicateWords(text) {
  const seen = new Set();
  const cleaned = String(text || "").split(/\s+/).filter(token => {
    const normalized = token.toLowerCase().replace(/[^a-z0-9]/g, "");
    if (!normalized) return true;
    if (seen.has(normalized)) return false;
    seen.add(normalized);
    return true;
  }).join(" ");
  return cleaned
    .replace(/\s+([,.;:/)])/g, "$1")
    .replace(/([(/])\s+/g, "$1")
    .replace(/\s*[,/-]\s*[,/-]+/g, ", ")
    .replace(/^[\s,.;:/()-]+|[\s,.;:/()-]+$/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function installPdfFonts(doc) {
  Object.entries(EMBEDDED_PDF_FONTS).forEach(([style, base64]) => {
    const fileName = `DejaVuSans-${style}.ttf`;
    doc.addFileToVFS(fileName, base64);
    doc.addFont(fileName, "DejaVuSans", style);
  });
  doc.setFont("DejaVuSans", "normal");
}

function drawFittedText(doc, text, x, y, maxWidth, maxHeight, options = {}) {
  const {
    startSize = 9,
    minSize = 6.2,
    hardMinSize = 1.8,
    lineHeightFactor = 1.08,
    align = "left",
    fontStyle = "normal",
    color = [0, 0, 0]
  } = options;

  doc.setFont("DejaVuSans", fontStyle);
  doc.setTextColor(...color);
  const value = String(text || "").trim();
  let size = startSize;
  let lines = [];
  let lineHeight = 0;

  // First preserve the preferred minimum. If unusually long data still does
  // not fit, continue shrinking safely instead of clipping or overflowing.
  while (size >= hardMinSize) {
    doc.setFontSize(size);
    lines = doc.splitTextToSize(value, maxWidth);
    lineHeight = size * 0.3528 * lineHeightFactor;
    if (lines.length * lineHeight <= maxHeight) break;
    size -= size > minSize ? 0.25 : 0.15;
  }

  size = Math.max(size, hardMinSize);
  doc.setFontSize(size);
  lines = doc.splitTextToSize(value, maxWidth);
  lineHeight = size * 0.3528 * lineHeightFactor;
  doc.text(lines, x, y, { align, lineHeightFactor });
  return { lines, size, height: lines.length * lineHeight };
}
